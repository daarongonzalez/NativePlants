name: Run ingestion

# Triggers a reference data load on the deployed ingest Worker.
#
# Run it from the Actions tab: "Run ingestion" -> "Run workflow". No local
# toolchain needed.
#
# The Worker runs on Cloudflare's network, so it can reach Oregon State's PRISM
# files and the other upstream sources regardless of what any individual machine can.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which load to run. Soil and plants are opt-in; the default runs zones and frost."
        type: choice
        default: reference
        options:
          - reference
          - soil
          - plants

# Same group as the deploy workflow, so this queues behind a deploy in
# progress rather than racing it.
concurrency:
  group: cloudflare-workers
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the run
        run: |
          if [ -z "${INGEST_URL}" ] || [ -z "${RUN_TOKEN}" ]; then
            echo "::error::Set the INGEST_WORKER_URL and INGEST_RUN_TOKEN repository secrets first."
            exit 1
          fi

          query=""
          if [ "${JOB}" != "reference" ]; then query="?job=${JOB}"; fi

          echo "Triggering ${INGEST_URL}/__run${query}"
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 3000 \
            -X POST "${INGEST_URL}/__run${query}" \
            -H "Authorization: Bearer ${RUN_TOKEN}")

          echo "HTTP ${code}"
          cat response.json
          echo

          # A 404 here means the token did not match - the route hides itself
          # rather than confirming it exists.
          if [ "$code" != "200" ]; then
            echo "::error::Ingestion did not run. A 404 usually means INGEST_RUN_TOKEN is wrong."
            exit 1
          fi

          # Check EVERY job, not the total.
          #
          # Summing across jobs hid a real failure once: the zone job skipped
          # all 67 ZIPs with an error, the frost job wrote its single row, the
          # total came to 1, and the run reported success.
          python3 - <<'PY'
          import json, sys

          results = json.load(open("response.json"))["results"]
          failed = []

          for r in results:
              written, skipped = r["rowsWritten"], r["rowsSkipped"]
              print(f"{r['job']}: {written} written, {skipped} skipped")
              for w in r["warnings"][:40]:
                  print(f"    warning: {w}")
              if len(r["warnings"]) > 40:
                  print(f"    ... and {len(r['warnings']) - 40} more")
              if written == 0:
                  failed.append(r["job"])

          if failed:
              print(f"::error::These jobs wrote zero rows: {', '.join(failed)}")
              sys.exit(1)

          print("Every job wrote at least one row.")
          PY
        env:
          INGEST_URL: ${{ secrets.INGEST_WORKER_URL }}
          RUN_TOKEN: ${{ secrets.INGEST_RUN_TOKEN }}
          JOB: ${{ inputs.job }}

name: Deploy

# Deploys both Workers to Cloudflare. Exists so the project can be operated
# entirely from GitHub and the Cloudflare dashboard, with no local toolchain.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Shared with the ingestion workflow: the two must never overlap. An
# ingestion run that starts mid-deploy hits whichever code happens to be
# live, which once produced a failure report for a bug that was already
# fixed and seconds away from being deployed.
#
# cancel-in-progress is false on purpose. Cancelling a half-finished
# deploy or a database write to start another is worse than queueing.
concurrency:
  group: cloudflare-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Never deploy something that does not typecheck or pass its tests.
      - run: pnpm typecheck
      - run: pnpm test

      - name: Deploy API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api

      - name: Deploy ingest
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/ingest
          secrets: |
            RUN_TOKEN
        env:
          RUN_TOKEN: ${{ secrets.INGEST_RUN_TOKEN }}

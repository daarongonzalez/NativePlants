<!doctype html>
<!--
  Share card for link previews (iMessage, Slack, LinkedIn and others).
  Source for apps/web/public/og.png. Re-draw it with: pnpm --filter @np/web og
  The canvas is fixed at 1200 x 630, the size every link-preview service asks for.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<link rel="stylesheet" href="../../../design/nativo/fonts.css">
<link rel="stylesheet" href="../../../design/nativo/tokens.css">
<link rel="stylesheet" href="../../../packages/ui/src/tokens.css">
<link rel="stylesheet" href="../../../packages/ui/src/playful.css">
<link rel="stylesheet" href="../app/styles/landing.css">
<style>
  html, body { margin: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: var(--font-body);
  }
  .og {
    box-sizing: border-box;
    width: 1200px;   /* fixed canvas: link-preview standard */
    height: 630px;
    padding: var(--space-40) var(--space-48) var(--space-48) var(--space-40);
    display: flex;
  }
  .og__card {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    border: var(--border-2) solid var(--line);
    border-radius: var(--radius-window-lg);
    box-shadow: var(--shadow-8);
    overflow: hidden;
  }
  .og__body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: var(--space-24);
    padding: var(--space-40) var(--space-56) var(--space-36);
  }
  .og__top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .og__wordmark {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: var(--type-h3);
    color: var(--green);
    line-height: 1;
  }
  .og__title {
    margin: 0;
    font-size: var(--type-h1);
    max-width: 12ch;
  }
  .og__band {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    background: var(--meadow);
    border-top: var(--border-2) solid var(--line);
    padding: 0 var(--space-56) var(--space-20);
  }
  .og__url {
    font-family: var(--np-font-mono);
    font-size: var(--type-mono);
    color: var(--green-deep);
  }
  .og__main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 30%;
    align-items: end;
    gap: var(--space-24);
  }
  .og__art-box {
    position: relative;
    align-self: stretch;
  }
  .og__art {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;   /* keeps the drawing's own proportions */
  }
</style>
</head>
<body>
  <div class="og">
    <div class="og__card">
      <div class="og__body">
        <div class="og__top">
          <span class="og__wordmark">nativo</span>
          <span class="lp-badge lp-badge--sky lp-badge--tilt">Now serving the Wasatch Front</span>
        </div>
        <div class="og__main">
          <h1 class="lp-h1 og__title">Native plants and <span class="lp-accent">lawn rebates</span> for your yard</h1>
          <div class="og__art-box"><img class="og__art" src="../../../design/nativo/assets/Branch/branch-04-green.svg" alt=""></div>
        </div>
      </div>
      <div class="og__band">
        <span class="og__url">grownativo.com</span>
      </div>
    </div>
  </div>
</body>
</html>

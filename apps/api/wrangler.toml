name = "nativeplants-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive keeps warm connection pools at the edge in front of Neon.
# Points at the Neon DIRECT host (no "-pooler") — Hyperdrive does the pooling,
# and stacking it on Neon's pooler fails under load rather than immediately.
#
# Query caching is DISABLED on this config. Hyperdrive's cache does not
# invalidate on writes, so a cached read of a site profile or a saved list
# could serve stale or another gardener's data. Reference tables would benefit
# from caching, but one config serves both, so correctness wins. If reference
# reads ever need it, add a SECOND cached config and bind it separately.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "df4a5c68e1464a9db5e7080829fce511"

# Caches Google's public keys for Firebase token verification.
[[kv_namespaces]]
binding = "AUTH_KEYS"
id = "1cb0f9131fe848c899674e965b755592"

[vars]
# Public identifier, not a credential. Token verification fetches Google's
# published signing keys and checks the token's `aud` claim against this.
# No API key, no service account, no secret anywhere in this Worker.
FIREBASE_PROJECT_ID = "nativeplants-eb3c5"
MARKET = "wasatch-front"
# The plot planner offers draft plants, labelled as drafts, until the reviewer
# publishes the sheet. Set to "published" (or remove) once they have.
PLANNER_PLANTS = "drafts"
# The plant review page (/admin/review on the web app), behind Cloudflare
# Access. Until all three are set, the review routes answer 503. None of them
# is a secret. See docs/plant-review.md for the setup steps.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
REVIEWER_EMAILS = ""

[observability]
enabled = true

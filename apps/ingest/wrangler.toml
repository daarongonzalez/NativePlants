name = "nativeplants-ingest"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Reference data changes rarely. Hardiness zones get an annual re-check and
# frost normals change once a decade, so these run monthly and are idempotent
# rather than running often and hoping.
[triggers]
crons = ["0 4 1 * *"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"

[vars]
MARKET = "wasatch-front"

[observability]
enabled = true

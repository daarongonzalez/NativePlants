name = "nativeplants-ingest"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Reference data changes rarely. Hardiness zones get an annual re-check and
# frost normals change once a decade, so these run monthly and are idempotent
# rather than running often and hoping.
[triggers]
crons = ["0 4 1 * *"]

# Same Hyperdrive config as the API. Ingestion needs no KV — it never
# authenticates a user.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "df4a5c68e1464a9db5e7080829fce511"

[vars]
MARKET = "wasatch-front"

[observability]
enabled = true
